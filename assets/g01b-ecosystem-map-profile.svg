<title id="g01b-ecosystem-map-profile-t">The ecosystem</title>
<desc id="g01b-ecosystem-map-profile-d">Three separate GitHub accounts. The research account holds Lean 4 and Mathlib's axioms, the IsmailsPrimitives repository, the companion papers and two side projects (Glossary and Protocols). The field account holds the Field of Decisional Integrity, which rests on the proof. The commercial account holds Literacity, which applies the Field's Standard.</desc>
