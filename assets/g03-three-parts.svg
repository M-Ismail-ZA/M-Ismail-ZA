<rect x="315" y="68" width="250" height="404" rx="10" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="1"/>
<text x="327" y="94" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0F766E" font-weight="700" letter-spacing="0.9">PART II</text>
<text x="327" y="122" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="20" fill="#0F766E" font-weight="700">Independence</text>
<text x="327" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5B5850">Phase4.lean</text>
<text x="327" y="166" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">No primitive is derivable from, or</text>
<text x="327" y="184" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">substitutable by, any other. All thirty</text>
<text x="327" y="202" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">ordered pairs, covered by one master</text>
<text x="327" y="220" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">theorem.</text>
<rect x="327" y="252" width="121.138" height="22" rx="11" fill="#ECF4F3"/>
<text x="337" y="267" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0C5B55" font-weight="700" letter-spacing="0.4">UNCONDITIONAL</text>
