<text x="169" y="425" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">X₅</text>
<circle cx="231" cy="420" r="22" fill="none" stroke="#0F766E" stroke-width="2"/>
