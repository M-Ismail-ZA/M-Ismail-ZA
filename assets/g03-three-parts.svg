<text x="44" y="46" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0F766E" font-weight="700" letter-spacing="0.9">THE THREE PARTS</text>
<rect x="44" y="68" width="250" height="404" rx="10" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="1"/>
<text x="56" y="94" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0F766E" font-weight="700" letter-spacing="0.9">PART I</text>
<text x="56" y="122" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="20" fill="#0F766E" font-weight="700">Necessity</text>
<text x="56" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5B5850">Phase3.lean</text>
<text x="56" y="166" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">Lacking a primitive forces linear Ω(T)</text>
<text x="56" y="184" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">regret in an explicit, minimal environment</text>
<text x="56" y="202" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">built to exhibit that one failure. Six</text>
<text x="56" y="220" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">independent theorems.</text>
<rect x="56" y="252" width="121.138" height="22" rx="11" fill="#ECF4F3"/>
<text x="66" y="267" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0C5B55" font-weight="700" letter-spacing="0.4">UNCONDITIONAL</text>
