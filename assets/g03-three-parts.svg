<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" role="img" aria-labelledby="g03-three-parts-t g03-three-parts-d">
<title id="g03-three-parts-t">The three parts</title>
<desc id="g03-three-parts-d">Part I proves necessity of each primitive in Phase3.lean. Part II proves mutual independence across all thirty ordered pairs in Phase4.lean. Part III proves sequential dependence as a cycle X1 to X6 and back to X1 in Phase5.lean, conditional on stated hypotheses.</desc>
