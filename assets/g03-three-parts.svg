<rect x="586" y="68" width="250" height="404" rx="10" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="1"/>
<text x="598" y="94" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="11" fill="#0F766E" font-weight="700" letter-spacing="0.9">PART III</text>
<text x="598" y="122" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="20" fill="#0F766E" font-weight="700">Sequential dependence</text>
<text x="598" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5B5850">Phase5.lean</text>
<text x="598" y="166" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">The six compose into a directed chain X₁</text>
<text x="598" y="184" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">→ X₂ → … → X₆ → X₁. Each link has a</text>
<text x="598" y="202" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">forward theorem, a reverse theorem and a</text>
<text x="598" y="220" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">non-reversibility result; the closing link</text>
<text x="598" y="238" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif" font-size="13" fill="#000000">rests on a Doob martingale.</text>
<rect x="598" y="252" width="124.303" height="22" rx="11" fill="#ECF4F3"/>
